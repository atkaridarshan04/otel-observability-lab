# =============================================================================
# OpenTelemetry Collector - PHASE 3
# =============================================================================
# Changed from Phase 2: logs now go to Loki as well as stdout. All three
# signals now have a real backend, and all three carry the same trace_id.
#
# Note what did NOT change to add a tracing backend: no application code, no
# image rebuild, no SDK config. The apps still just send OTLP to the collector
# and have no idea Tempo exists. That indirection is the collector's main job.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # Tempo speaks OTLP natively, so this is just "forward it onward".
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true        # lab-local plaintext. never in production.

  # Re-exposes everything received over OTLP in Prometheus text format, on
  # :9464/metrics, for Prometheus to scrape. Note the direction change: OTLP is
  # PUSH (app -> collector), Prometheus is PULL (prometheus -> collector). The
  # collector is the adapter between the two models.
  prometheus:
    endpoint: 0.0.0.0:9464
    # Exemplars - the pointers from a histogram bucket to a real trace - only
    # exist in the OpenMetrics exposition format. Without this line you get
    # metrics, but no way to jump from a latency spike to the trace that caused
    # it, which is half the reason to run this stack at all.
    enable_open_metrics: true
    # How long a metric stays exposed after its last update. Too short and
    # Prometheus sees gaps; too long and dead series linger.
    metric_expiration: 5m

  # Loki 3.x ingests OTLP natively at /otlp - there is no Loki-specific
  # exporter any more, just plain OTLP over HTTP. Older guides reference a
  # `loki` exporter that has since been removed from the collector.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Dialled down from `detailed` now that a real UI exists. Flip it back to
  # `detailed` any time you want to read the raw data model again.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]   # fan-out: one pipeline, two destinations
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]

  telemetry:
    logs:
      level: info
    # The collector's OWN metrics. Monitoring the thing that does your
    # monitoring is not optional: a collector silently dropping data looks
    # exactly like a quiet system.
    #
    # `service.telemetry.metrics.address` was DEPRECATED in collector v0.123.0
    # and is now ignored. The replacement is this `readers` block. The default
    # bind is 127.0.0.1:8888, which is unreachable from another container - so
    # on Docker or Kubernetes you MUST set host explicitly or Prometheus will
    # scrape nothing and report the target as down.
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
                without_type_suffix: true
                without_units: true
