# =============================================================================
# OpenTelemetry Collector - PHASE 1
# =============================================================================
# Changed from Phase 0: traces now go to Tempo as well as stdout.
#
# Note what did NOT change to add a tracing backend: no application code, no
# image rebuild, no SDK config. The apps still just send OTLP to the collector
# and have no idea Tempo exists. That indirection is the collector's main job.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # Tempo speaks OTLP natively, so this is just "forward it onward".
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true        # lab-local plaintext. never in production.

  # Dialled down from `detailed` now that a real UI exists. Flip it back to
  # `detailed` any time you want to read the raw data model again.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]   # fan-out: one pipeline, two destinations
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]               # Phase 2 points this at Prometheus
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]               # Phase 3 points this at Loki

  telemetry:
    logs:
      level: info
