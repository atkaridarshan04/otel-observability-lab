# =============================================================================
# OpenTelemetry Collector - PHASE 0
# =============================================================================
# Every collector config has the same four-part shape, no matter how big it gets:
#
#   receivers  - how telemetry GETS IN     (otlp, prometheus, filelog, ...)
#   processors - what happens IN TRANSIT   (batch, memory_limiter, filter, ...)
#   exporters  - where telemetry GOES OUT  (debug, otlp, prometheus, loki, ...)
#   service    - which of the above are actually WIRED TOGETHER into pipelines
#
# Declaring a component does nothing. Only `service.pipelines` activates it.
# That trips up everyone once.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Groups telemetry into batches before export. In production this is the single
  # biggest efficiency win. Kept short here so output appears while you watch.
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # Phase 0's whole point: dump the raw OTLP data model to stdout so you can read
  # what a span/metric/log ACTUALLY is before any UI pretty-prints it for you.
  # `verbosity: detailed` prints every attribute. Never use this in production -
  # it will out-log your application by an order of magnitude.
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
