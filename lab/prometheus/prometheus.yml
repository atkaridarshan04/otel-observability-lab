# Prometheus scrapes the COLLECTOR, not the applications.
#
# This is worth pausing on. The apps push OTLP to the collector; the collector
# re-exposes those metrics in Prometheus format; Prometheus pulls from the
# collector. The applications have no /metrics endpoint, no Prometheus client
# library, and no knowledge that Prometheus exists.
#
# The practical payoff: swapping Prometheus for Mimir, Thanos, or a vendor is a
# collector config change. Nothing is redeployed.

global:
  scrape_interval: 5s          # fast for a lab. 15-60s in production.
  evaluation_interval: 15s
  external_labels:
    cluster: lab

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
    # honor_labels keeps the `job` and `instance` labels the collector derives
    # from each app's service.name / service.instance.id, instead of Prometheus
    # overwriting them with "otel-collector". Without this every metric looks
    # like it came from the collector itself.
    honor_labels: true

  # The collector's own health. Phase 4 leans on this heavily - a dropped-data
  # collector is an invisible outage unless you watch it.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

rule_files:
  - /etc/prometheus/rules/*.yml
