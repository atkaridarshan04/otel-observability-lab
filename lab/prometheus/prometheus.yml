# Prometheus scrapes the COLLECTOR, not the applications.
#
# This is worth pausing on. The apps push OTLP to the collector; the collector
# re-exposes those metrics in Prometheus format; Prometheus pulls from the
# collector. The applications have no /metrics endpoint, no Prometheus client
# library, and no knowledge that Prometheus exists.
#
# The practical payoff: swapping Prometheus for Mimir, Thanos, or a vendor is a
# collector config change. Nothing is redeployed.

global:
  scrape_interval: 5s          # fast for a lab. 15-60s in production.
  evaluation_interval: 15s
  external_labels:
    cluster: lab

scrape_configs:
  # Application metrics + span metrics, re-exposed by the GATEWAY.
  - job_name: otel-gateway
    static_configs:
      - targets: ["otel-gateway:9464"]
    # honor_labels keeps the `job` and `instance` labels the collector derives
    # from each app's service.name / service.instance.id, instead of Prometheus
    # overwriting them with "otel-collector". Without this every metric looks
    # like it came from the collector itself.
    honor_labels: true

  # Both collector tiers' OWN health. A dropped-data collector is an invisible
  # outage unless you watch it, and with two tiers you need to know WHICH tier
  # is refusing data - the answer changes what you do about it.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-agent:8888"]
        labels: { tier: agent }
      - targets: ["otel-gateway:8888"]
        labels: { tier: gateway }

# Where Prometheus sends alerts once a rule fires. Prometheus decides WHETHER
# an alert fires; Alertmanager decides who hears about it and how often.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml
