# Provisioned datasources. Checking these into git is the point: nobody should
# be clicking through a UI to wire up observability, in a lab or in production.
#
# The three cross-links below are what turn three separate databases into one
# investigation surface. Without them you have three tabs and a clipboard.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # METRICS -> TRACES. Prometheus stores an exemplar beside a histogram
      # bucket carrying the trace_id of one real request that landed in it.
      # This tells Grafana to resolve that trace_id against Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      streamingEnabled:
        search: true
      # TRACES -> LOGS. The final edge of the triangle: from any span, jump to
      # the log lines emitted during that exact request. This is the last step
      # of the golden path - the one that shows you the actual error text.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      # TRACES -> METRICS. From a trace, see the RED metrics of its service.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: job
      serviceMap:
        datasourceUid: prometheus

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # LOGS -> TRACES. Closing the loop: any log line carrying trace_id gets a
      # clickable link straight into Tempo.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View trace
