# =============================================================================
# PHASE 4 stack.
#
#   postgres, redis                    - infrastructure the app depends on
#   gateway/orders/payments/inventory  - the app under observation
#   loadgen                            - keeps traffic flowing
#   otel-agent                         - collector, agent tier (per host)
#   otel-gateway                       - collector, gateway tier (scaled)
#   tempo / prometheus / loki          - one backend per signal
#   grafana                            - the single investigation surface
#
# Telemetry path: app -> agent -> gateway -> backends. Every hop speaks OTLP,
# which is what makes the tiers composable.
# =============================================================================

x-app-env: &app-env
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  # --- Standard OTel SDK env vars. These are THE config surface for every
  # --- language's SDK, and they are identical on Docker, k8s, or a VM.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  # Resource attributes describe WHO is emitting. They are attached to every
  # single span, metric and log from this process. Getting these right is a
  # DevOps responsibility and it is what makes "which deployment broke?" answerable.
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop,deployment.environment=lab,service.version=0.1.0
  # --- Metric temporality. CUMULATIVE means "total since process start";
  # --- DELTA means "what happened since the last export". Prometheus is a
  # --- cumulative system, so cumulative passes straight through. Choosing
  # --- delta here would need a deltatocumulative processor in the collector.
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: ${OTEL_METRICS_TEMPORALITY:-cumulative}
  # --- Exemplar filter. trace_based (the default) records an exemplar only
  # --- when a SAMPLED span is active, which is what links a metric to a trace.
  OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
  # --- How often the SDK pushes metrics. The spec default is 60s, which makes
  # --- a lab feel broken: you change something, see nothing for a minute, and
  # --- start debugging a pipeline that was fine. 10s here. Leave it at the
  # --- default in production - this interval costs network and cardinality.
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
  # --- Head sampling. Decided in-process, at the ROOT span, before anything is
  # --- known about how the request turns out. Phase 1 exercise: set the sampler
  # --- to parentbased_traceidratio with arg 0.1 and watch what you lose.
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

x-app-base: &app-base
  restart: unless-stopped
  depends_on:
    otel-agent:
      condition: service_started

services:
  # ---------------------------------------------------------------- infra ----
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: otel
      POSTGRES_DB: otel
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["6379:6379"]

  # ------------------------------------------------------------ collector ----
  # --- AGENT tier: one per host (a DaemonSet in Kubernetes) ----------------
  # Close to the app, cheap work only. Apps send here and nowhere else.
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/agent.yaml"]
    volumes:
      - ./collector/agent.yaml:/etc/otelcol/agent.yaml:ro
    ports:
      - "4317:4317"    # OTLP/gRPC
      - "4318:4318"    # OTLP/HTTP
      - "8888:8888"    # its own internal metrics
      - "13133:13133"  # health_check
      - "55679:55679"  # zpages
    depends_on: [otel-gateway]
    restart: unless-stopped

  # The collector image is distroless and runs as UID 10001, but Docker creates
  # named volumes root-owned - so the persistent queue fails with "permission
  # denied" and the gateway refuses to start entirely. Kubernetes solves this
  # declaratively with securityContext.fsGroup; Compose has no equivalent, so
  # we chown once before the gateway boots.
  queue-init:
    image: alpine:3.21
    command: ["sh", "-c", "mkdir -p /q && chown -R 10001:10001 /q"]
    volumes:
      - gateway-queue:/q
    restart: "no"

  # --- GATEWAY tier: a scaled Deployment ------------------------------------
  # Everything expensive and stateful: tail sampling, PII scrubbing, span
  # metrics, vendor fan-out.
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/gateway.yaml"]
    volumes:
      - ./collector/gateway.yaml:/etc/otelcol/gateway.yaml:ro
      - gateway-queue:/var/lib/otelcol/queue
    ports:
      - "9464:9464"    # Prometheus exposition of app + span metrics
      - "8889:8888"    # its own internal metrics (8888 taken by the agent)
      - "13134:13133"  # health_check
      - "55680:55679"  # zpages
      - "1777:1777"    # pprof
    depends_on:
      queue-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------- backends ----
  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API (query it directly with curl)
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      # Exemplar storage is STILL behind a feature flag in Prometheus 3.x.
      # Without it exemplars are silently discarded on ingest and the
      # metric-to-trace jump just never appears in Grafana.
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on: [otel-gateway]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Lab convenience only. Never do this anywhere real.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "3000:3000"
    depends_on: [tempo, prometheus, loki]
    restart: unless-stopped

  # ------------------------------------------------------------------ app ----
  gateway:
    <<: *app-base
    build: { context: ../app, args: { SERVICE: gateway } }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: gateway
      ORDERS_URL: http://orders:8000
    ports: ["8080:8000"]

  orders:
    <<: *app-base
    build: { context: ../app, args: { SERVICE: orders } }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: orders
      PAYMENTS_URL: http://payments:8000
      INVENTORY_URL: http://inventory:8000
      DATABASE_URL: postgresql://otel:otel@postgres:5432/otel
      ORDERS_POOL_SIZE: ${ORDERS_POOL_SIZE:-10}
      ORDERS_CARDINALITY_DEMO: ${ORDERS_CARDINALITY_DEMO:-false}
    depends_on:
      postgres: { condition: service_healthy }
      otel-agent: { condition: service_started }

  payments:
    <<: *app-base
    build: { context: ../app, args: { SERVICE: payments } }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: payments
      PAYMENTS_LATENCY_MS: ${PAYMENTS_LATENCY_MS:-40}
      PAYMENTS_FAILURE_RATE: ${PAYMENTS_FAILURE_RATE:-0.0}
      PAYMENTS_DECLINE_RATE: ${PAYMENTS_DECLINE_RATE:-0.02}

  inventory:
    <<: *app-base
    build: { context: ../app, args: { SERVICE: inventory } }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: inventory
      DATABASE_URL: postgresql://otel:otel@postgres:5432/otel
      REDIS_URL: redis://redis:6379/0
      INVENTORY_POOL_SIZE: ${INVENTORY_POOL_SIZE:-10}
      INVENTORY_SLOW_QUERY_MS: ${INVENTORY_SLOW_QUERY_MS:-0}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-agent: { condition: service_started }

  # Stands in for PagerDuty/Slack. Receives Alertmanager webhooks and prints
  # the real payload, so you can see exactly what a page would contain.
  alertsink:
    <<: *app-base
    build: { context: ../app, args: { SERVICE: alertsink } }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: alertsink
    ports: ["8081:8000"]

  loadgen:
    <<: *app-base
    build: { context: ../app, args: { SERVICE: loadgen } }
    command: ["python", "main.py"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: loadgen
      GATEWAY_URL: http://gateway:8000
      LOADGEN_RPS: ${LOADGEN_RPS:-5}

volumes:
  alertmanager-data:
  gateway-queue:
  loki-data:
  tempo-data:
  grafana-data:
  prometheus-data:
