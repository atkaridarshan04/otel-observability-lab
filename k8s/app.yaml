# =============================================================================
# The application on Kubernetes.
#
# READ THE ANNOTATIONS, then read everything else.
#
# There is no OpenTelemetry configuration in this file. No SDK env vars, no
# endpoint, no sampler, no sidecar, no changed image. The ONLY thing that turns
# telemetry on is one annotation per Deployment:
#
#     instrumentation.opentelemetry.io/inject-python: "true"
#
# The Operator's mutating webhook sees that annotation at pod-admission time and
# rewrites the pod: it adds an init container that copies the SDK onto a shared
# volume, sets PYTHONPATH so the SDK auto-initialises, and injects every OTEL_*
# variable from the Instrumentation resource.
#
# These are the SAME images used by docker compose. Nothing was rebuilt.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata: { name: shop-config, namespace: shop }
data:
  DATABASE_URL: postgresql://otel:otel@postgres:5432/otel
  REDIS_URL: redis://redis:6379/0
  PAYMENTS_URL: http://payments:8000
  INVENTORY_URL: http://inventory:8000
  ORDERS_URL: http://orders:8000
  GATEWAY_URL: http://gateway:8000
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: otel }
            - { name: POSTGRES_PASSWORD, value: otel }
            - { name: POSTGRES_DB, value: otel }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: init, mountPath: /docker-entrypoint-initdb.d }]
          resources: { requests: { memory: 128Mi, cpu: 50m }, limits: { memory: 256Mi } }
      volumes: [{ name: init, configMap: { name: pg-init } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: shop }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources: { requests: { memory: 32Mi, cpu: 20m }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: shop }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"   # <-- the whole thing
    spec:
      containers:
        - name: gateway
          image: lab-gateway:latest
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: shop-config } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 3 }
          resources: { requests: { memory: 96Mi, cpu: 50m }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: shop }
spec:
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30080 }]
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders } }
  template:
    metadata:
      labels: { app: orders }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: orders
          image: lab-orders:latest
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: shop-config } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
          resources: { requests: { memory: 96Mi, cpu: 50m }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: shop }
spec:
  selector: { app: orders }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata:
      labels: { app: payments }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: payments
          image: lab-payments:latest
          imagePullPolicy: Never
          env:
            - { name: PAYMENTS_LATENCY_MS, value: "40" }
            - { name: PAYMENTS_FAILURE_RATE, value: "0.0" }
            - { name: PAYMENTS_DECLINE_RATE, value: "0.02" }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 3 }
          resources: { requests: { memory: 96Mi, cpu: 50m }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: shop }
spec:
  selector: { app: payments }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory } }
  template:
    metadata:
      labels: { app: inventory }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: inventory
          image: lab-inventory:latest
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: shop-config } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
          resources: { requests: { memory: 96Mi, cpu: 50m }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: inventory, namespace: shop }
spec:
  selector: { app: inventory }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata:
      labels: { app: loadgen }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: loadgen
          image: lab-loadgen:latest
          imagePullPolicy: Never
          command: ["python", "main.py"]
          envFrom: [{ configMapRef: { name: shop-config } }]
          env: [{ name: LOADGEN_RPS, value: "6" }]
          resources: { requests: { memory: 64Mi, cpu: 30m }, limits: { memory: 192Mi } }
